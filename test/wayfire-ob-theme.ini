# Headless config for ob-theme provider tests.
# ob-theme loads FIRST via its order_hint; ipc-rules is the observation
# endpoint. command/<super>T kitty kept per test-ini convention so the
# same ini works for interactive sessions too.
[core]
plugins = ob-theme ipc command ipc-rules
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[ob-theme]
theme_name = OB-Arc-Dark
