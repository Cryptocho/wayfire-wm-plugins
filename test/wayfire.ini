# Minimal config for proto-pan smoke/interactive tests.
# Single workspace: the pan rail replaces the workspace grid for this prototype.
# `ipc`    -> scripts can drive pan/step|drag via the JSON-RPC socket
# `command`-> <super>T opens kitty inside the nested session (input tests).
#             NOTE: <super>T is deliberately chosen because it is unbound on
#             the user's main desktop (<super>ENTER is taken there and would
#             launch a terminal on the host instead of the nested session).
[core]
plugins = proto-pan ipc command
vwidth = 1
vheight = 1

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[proto-pan]
duration = 1000
