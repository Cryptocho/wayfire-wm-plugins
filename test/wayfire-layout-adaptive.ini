# Headless/interactive config for the adaptive tiling style + focus
# follows mouse (scripts/lm-test.sh phase 4; also usable nested with
# WLR_BACKENDS=wayland for TEST.md P4).
[core]
plugins = layout-manager ob-decor ob-menu move resize vswitch ipc ipc-rules autostart command
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[autostart]
test_term1 = kitty
test_term2 = kitty
test_term3 = kitty

[vswitch]
binding_1 = <super> KEY_F1
binding_2 = <super> KEY_F2

[layout-manager]
default_mode = stacking
tiling_layout = adaptive
focus_follows_mouse = true

[ob-decor]
theme = OB-Arc-Dark
ring_width = 2

[ob-menu]
menu_file = /home/cryptocho/workspace/wm/wayfire-wm-plugins/tests/root-menu.xml
key_root_menu = <super> KEY_F3
