# Headless config for layout-manager integration tests (phase 3): tiling
# together with ob-decor decorations and the ob-menu root menu.
[core]
plugins = layout-manager ob-decor ob-menu move resize vswitch ipc ipc-rules autostart command
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[autostart]
test_term1 = kitty
test_term2 = kitty
test_term3 = kitty

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[vswitch]
binding_1 = <super> KEY_F1
binding_2 = <super> KEY_F2

[ob-decor]
theme = OB-Arc-Dark
ring_width = 2

[ob-menu]
menu_file = /home/cryptocho/workspace/wm/wayfire-wm-plugins/tests/root-menu.xml
key_root_menu = <super> KEY_F3
