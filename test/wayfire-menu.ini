# Nested-session config for ob-menu interactive tests (M5: ipc-rules is the
# observation endpoint for action assertions; autostart spawns a test view).
[core]
plugins = ob-menu ipc command ipc-rules autostart
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[autostart]
test_term = kitty

[ob-menu]
menu_file = /home/cryptocho/workspace/wm/wayfire-wm-plugins/tests/root-menu.xml
