# Nested-session config for ob-menu INTERACTIVE tests (TEST.md M section):
# menu system + ob-decor decorations (menu button / titlebar right-click) +
# move/resize as the decoration-gesture executors. The headless automation
# keeps using test/wayfire-menu.ini.
[core]
plugins = ob-decor ob-menu move resize ipc ipc-rules command
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[ob-decor]
theme = OB-Arc-Dark
ring_width = 2

[ob-menu]
menu_file = /home/cryptocho/workspace/wm/wayfire-wm-plugins/tests/root-menu.xml
