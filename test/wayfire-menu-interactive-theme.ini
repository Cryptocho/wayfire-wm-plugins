# decor-destroy-test with the ob-theme provider co-loaded (provider path:
# theme comes from ob-theme's idempotent init, ob-decor/ob-menu follow it).
# One-shot ini — the headless automation companion; the canonical
# interactive ini (wayfire-menu-interactive.ini) stays provider-absent to
# exercise the fallback path.
[core]
plugins = ob-theme ob-decor ob-menu move resize ipc ipc-rules command
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[ob-theme]
theme_name = OB-Arc-Dark

[ob-decor]
ring_width = 2

[ob-menu]
menu_file = /home/cryptocho/workspace/wm/wayfire-wm-plugins/tests/root-menu.xml
