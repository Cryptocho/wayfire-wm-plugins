# Nested-session config for ext-workspace interactive tests (P7).
# 4x1 grid + vswitch (F1..F4, avoiding the user's super+1..4) + waybar
# autostarted with the user's real bar config, so the ext/workspaces module
# drives the protocol end to end. Also used by the headless suite (A-E).
[core]
plugins = command ipc ext-workspace vswitch gtk-shell
vwidth = 4
vheight = 1

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[vswitch]
binding_1 = <super> KEY_F1
binding_2 = <super> KEY_F2
binding_3 = <super> KEY_F3
binding_4 = <super> KEY_F4

[autostart]
waybar = waybar --bar main-bar --config "$HOME/.config/wayfire/waybar/config" --style "$HOME/.config/wayfire/waybar/style.css"