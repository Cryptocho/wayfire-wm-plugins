# Interactive/headless config for ob-switcher tests (S section of TEST.md):
# provider + switcher + decorations + menus + two autostarted kitties for focus assertions.
# command/<super>T kitty kept per test-ini convention.
[core]
plugins = ob-theme ob-switcher ob-decor ob-menu move resize ipc command ipc-rules autostart
vwidth = 2
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[autostart]
test_term_a = kitty --title switcher-a
test_term_b = kitty --title switcher-b

[ob-switcher]
# alt+Tab: matches labwc defaults and avoids the user desktop's
# super+Tab (fast-switcher) — see AGENTS.md keybinding-avoidance list.
activate = <alt> KEY_TAB
activate_backward = <alt><shift> KEY_TAB
