# Headless config for layout-manager auto-float tests (scripts/lm-test.sh
# phase 2): every kitty is auto-floated, so tiling trees stay empty unless
# a view is explicitly tiled via toggle-float.
[core]
plugins = layout-manager ipc ipc-rules autostart command
vwidth = 2
vheight = 1

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[autostart]
test_term1 = kitty
test_term2 = kitty
test_term3 = kitty

[layout-manager]
default_mode = stacking
float_by_default = app_id is "kitty"
