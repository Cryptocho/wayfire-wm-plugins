# Nested-session config for ob-decor interactive tests (TEST.md).
# Single workspace; ob-decor + command (<super>T = kitty) + ipc for scripts.
[core]
plugins = ob-decor ob-menu move resize ipc ipc-rules command
vwidth = 1
vheight = 1
preferred_decoration_mode = server

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[ob-decor]
theme = OB-Arc-Dark
ring_width = 2
font_active = Sans Bold 14
font_inactive = Sans 10

[ob-menu]
font_menuitem_active = Sans Bold 12
menu_file = /home/cryptocho/workspace/wm/wayfire-wm-plugins/tests/root-menu.xml
