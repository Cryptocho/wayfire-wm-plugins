# Headless config for layout-manager automated tests (scripts/lm-test.sh).
# layout-manager + ipc-rules (observation endpoint) + autostart test views.
[core]
plugins = layout-manager ipc ipc-rules autostart
vwidth = 2
vheight = 1

[autostart]
test_term1 = kitty
test_term2 = kitty
test_term3 = kitty

[layout-manager]
default_mode = stacking
