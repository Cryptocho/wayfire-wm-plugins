# Headless config for layout-manager drag-to-reorder + faction-resize tests
# (scripts/lm-drag-test.sh). Button bindings are modifier-free so that the
# virtual pointer (vinput) can trigger them directly.
[core]
plugins = layout-manager ipc ipc-rules autostart command
vwidth = 2
vheight = 1

[command]
binding_terminal = <super> KEY_T
command_terminal = kitty

[autostart]
test_term1 = kitty
test_term2 = kitty
test_term3 = kitty

[layout-manager]
default_mode = stacking
animation_duration = 0
button_tile_move = BTN_LEFT
button_tile_resize = BTN_RIGHT